name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to attach binaries to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          docker build -t speranza-translator:${{ env.TAG_NAME }} -f Containerfile .

      - name: Package Container Binary Archive
        run: |
          docker save speranza-translator:${{ env.TAG_NAME }} | gzip -9 > speranza-${{ env.TAG_NAME }}-container-image.tar.gz
          sha256sum speranza-${{ env.TAG_NAME }}-container-image.tar.gz > SHA256SUMS.txt

      - name: Publish Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Speranza ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            speranza-${{ env.TAG_NAME }}-container-image.tar.gz
            SHA256SUMS.txt
