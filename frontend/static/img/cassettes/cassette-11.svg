  <polygon points="78,275 362,275 348,214 92,214" fill="#101216" stroke="#222630" stroke-width="1"/>


  <!-- Guide Holes in Chin -->
  <circle cx="118" cy="244" r="8" fill="#0E1015" stroke="#222630" stroke-width="1"/>
  <circle cx="322" cy="244" r="8" fill="#0E1015" stroke="#222630" stroke-width="1"/>
  <circle cx="152" cy="252" r="4.5" fill="#0E1015"/>
